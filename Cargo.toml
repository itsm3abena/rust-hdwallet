[package]
name = "hdwallet-rust"
version = "0.1.0"
edition = "2024"
description = "Hierarchical deterministic wallet primitives mirroring hdwallet-io/python-hdwallet layout"
license = "MIT"

[[bin]]
name = "hdwallet"
path = "src/bin/hdwallet.rs"

[dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["std", "rand"] }
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
unicode-normalization = "0.1"
hex = "0.4"
sha3 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
bech32 = "0.11"
hmac = "0.13"
sha2 = "0.11"
base58 = "0.1"
regex = "1"
serde_json = "1"
rand = "0.8"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
crc32fast = "1.4"
crc = "3"
serde_cbor = "0.11"
blake2 = "0.10"
data-encoding = "2.6"
curve25519-dalek = { version = "4.1", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
