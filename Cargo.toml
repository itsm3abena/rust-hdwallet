[package]
name = "hdwallet-rust"
version = "0.1.0-beta"
edition = "2024"
description = "Hierarchical deterministic wallet library for deriving cryptocurrency keys, addresses, and mnemonics."
license = "MIT"
readme = "README.md"
repository = "https://github.com/itsm3abena/hdwallet-rust"
authors = ["Abenezer L. <itsm3abena@gmail.com>"]
keywords = ["hdwallet", "bip32", "bip39", "cryptocurrency", "wallet"]
categories = ["cryptography", "command-line-utilities"]
rust-version = "1.85"

[lib]
name = "hdwallet_rust"
path = "src/lib.rs"

[[bin]]
name = "hdwallet"
path = "src/bin/hdwallet.rs"

[[test]]
name = "test_base58"
path = "tests/test_base58.rs"

[[test]]
name = "test_keys"
path = "tests/test_keys.rs"

[[test]]
name = "test_exceptions"
path = "tests/test_exceptions.rs"

[[test]]
name = "test_cryptos"
path = "tests/test_cryptos.rs"

[[test]]
name = "test_symbols"
path = "tests/test_symbols.rs"

[[test]]
name = "cli"
path = "tests/cli/mod.rs"

[[test]]
name = "hdwallet_addresses"
path = "tests/hdwallet/addresses/mod.rs"

[[test]]
name = "hdwallet_derivations"
